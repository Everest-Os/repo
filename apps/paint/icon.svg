<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a35" />
      <stop offset="100%" stop-color="#15151e" />
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Palette Base -->
  <path d="M12,48 C6,40 6,24 16,14 C26,4 46,6 52,18 C58,30 52,48 38,52 C32,54 26,46 22,46 C18,46 16,52 12,48 Z" fill="url(#paletteGrad)" stroke="#3e3e4f" stroke-width="2" />
  <!-- Thumb Hole -->
  <circle cx="20" cy="36" r="4" fill="#0c0c10" stroke="#3e3e4f" stroke-width="1.5" />
  <!-- Paint Blobs (Neon Colors) -->
  <circle cx="24" cy="20" r="5" fill="#ff007f" filter="url(#glow)" />
  <circle cx="38" cy="16" r="5" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="48" cy="26" r="5" fill="#39ff14" filter="url(#glow)" />
  <circle cx="44" cy="40" r="5" fill="#ffff00" filter="url(#glow)" />
  <!-- Paint Brush -->
  <path d="M48,8 L56,16 L32,40 L24,42 L26,34 Z" fill="url(#brushGrad)" />
  <path d="M24,42 L28,38 L26,34 L24,42 Z" fill="#2d2d2d" />
  <path d="M48,8 L52,12" stroke="#ffffff" stroke-width="1.5" />
</svg>
