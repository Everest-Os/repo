<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e081a" />
      <stop offset="100%" stop-color="#04020a" />
    </linearGradient>
    <filter id="neonPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#221133" stroke-width="2" />
  <!-- Grid Lines -->
  <path d="M16,0 V64 M32,0 V64 M48,0 V64 M0,16 H64 M0,32 H64 M0,48 H64" stroke="#160c26" stroke-width="1" />
  
  <!-- T-Block (Neon Purple) -->
  <g fill="#a855f7" filter="url(#neonPurple)" stroke="#c084fc" stroke-width="1">
    <rect x="24" y="16" width="16" height="16" rx="2" />
    <rect x="8" y="32" width="16" height="16" rx="2" />
    <rect x="24" y="32" width="16" height="16" rx="2" />
    <rect x="40" y="32" width="16" height="16" rx="2" />
  </g>
  <!-- I-Block segment or O-block (Neon Yellow) -->
  <g fill="#eab308" filter="url(#neonPurple)" stroke="#fde047" stroke-width="1">
    <rect x="8" y="48" width="16" height="16" rx="2" />
    <rect x="24" y="48" width="16" height="16" rx="2" />
  </g>
  <!-- Single Pixel cyan accent block -->
  <g fill="#00f0ff" filter="url(#neonPurple)" stroke="#22d3ee" stroke-width="1">
    <rect x="40" y="48" width="16" height="16" rx="2" />
  </g>
</svg>
