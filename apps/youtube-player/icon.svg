<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0707" />
      <stop offset="100%" stop-color="#0a0202" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5555" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#3a1212" stroke-width="2" />
  
  <!-- Outer glowing TV screen / Play outline -->
  <rect x="12" y="16" width="40" height="32" rx="8" fill="url(#playGrad)" stroke="#ff0000" stroke-width="2" filter="url(#neonRed)" />
  
  <!-- Inner Play Triangle (Cinema white button) -->
  <path d="M27,24 L41,32 L27,40 Z" fill="#ffffff" />
  
  <!-- Camera lens reflection effect -->
  <path d="M16,20 Q22,18 28,20" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round" />
</svg>
